<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Offline · AutoMarket</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f4f5f7;
        color: #111827;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(17, 24, 39, 0.06), 0 4px 16px rgba(17, 24, 39, 0.06);
      }
      .logo { width: 56px; height: 56px; }
      h1 { margin: 16px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 22px; color: #6b7280; line-height: 1.5; }
      button {
        width: 100%;
        min-height: 48px;
        border: none;
        border-radius: 12px;
        background: #f97316;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #ea580c; }
      .status { margin: 14px 0 0; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="./favicon.svg" alt="" class="logo" />
      <h1>You are offline</h1>
      <p>AutoMarket can't reach the internet right now. Check your Wi-Fi or mobile data and try again.</p>
      <button type="button" id="retry">Retry connection</button>
      <p class="status" id="status"></p>
    </main>

    <script>
      const status = document.getElementById('status')

      function tryAgain() {
        status.textContent = 'Checking…'
        // ?ping=<time> makes the URL new, so the service worker can't answer it from the cache
        fetch('./manifest.json?ping=' + Date.now(), { cache: 'no-store' })
          .then((response) => {
            if (response.ok) window.location.href = './'
            else throw new Error('offline')
          })
          .catch(() => (status.textContent = 'Still offline. We will reload as soon as the connection is back.'))
      }

      document.getElementById('retry').addEventListener('click', tryAgain)
      window.addEventListener('online', () => (window.location.href = './'))
    </script>
  </body>
</html>
